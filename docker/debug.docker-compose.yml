# Debug override: run the one-process backend (cmd/dev) under a headless Delve
# so VS Code can attach with breakpoints (see .vscode/launch.json). Normal runs
# are untouched; opt in with:
#
#   docker compose -f docker/dev.docker-compose.yml -f docker/debug.docker-compose.yml up
#
# The binary is built with -gcflags 'all=-N -l' (no optimizations/inlining) so
# breakpoints and variables are reliable. Every air hot-reload restarts dlv -
# re-attach with F5 after a rebuild.
services:
  ytsoar_api:
    build:
      target: debug
    image: ytsoar/backend:debug
    # the normal image entrypoint is /entrypoint.sh (make migrate && exec air),
    # so the override must keep the migration step
    entrypoint:
      - sh
      - -c
      - >-
        make migrate && exec air
        --build.cmd "go build -gcflags 'all=-N -l' -o ./tmp/dev ./cmd/dev"
        --build.bin tmp/dev
        --build.full_bin "dlv exec ./tmp/dev --headless --listen=:2345 --api-version=2 --accept-multiclient --continue"
    ports:
      - "2345:2345"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
