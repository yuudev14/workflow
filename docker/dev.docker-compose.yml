version: "3.9"
name: ytsoar
networks:
  ytsoar:
services:
  ytsoar_postgres:
    image: postgres:15
    container_name: ytsoar_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ytsoar
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ytsoar
    volumes:
      - postgres_data:/var/lib/postgresql/data
  ytsoar_keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: ytsoar_keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    ports:
      - "8180:8180"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8180
      # Split-horizon: the browser reaches Keycloak at localhost:8180 (so the
      # id_token issuer and the authorization redirect use this), while the api
      # reaches it in-network at ytsoar_keycloak:8180. BACKCHANNEL_DYNAMIC makes
      # the token/discovery endpoints follow the request host, so the api's
      # internal discovery returns internal backchannel urls it can actually hit.
      - KC_HOSTNAME=http://localhost:8180
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - ytsoar
  # One process: the api, the worker and the sandbox (cmd/dev). Dev only: the
  # sandbox shares the DB_* settings here. For the three programs apart, add
  # -f docker/split.docker-compose.yml (make start-split).
  ytsoar_api:
    build:
      context: ../app/ytsoar
      dockerfile: Dockerfile.dev
      target: dev
    image: ytsoar/backend:dev
    container_name: ytsoar_api
    # more than WORKER_STOP_GRACE_SECONDS, so running playbooks can be cancelled and saved before Docker kills the worker
    stop_grace_period: 60s
    ports:
      - "8080:8080"
    volumes:
      - ../app/ytsoar:/app
      # unified connectors tree: the API is its only writer (metadata now,
      # uploads later)
      - ../app/connectors:/opt/ytsoar/connectors
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=ytsoar_postgres
      - DB_PORT=5432
      - DB_NAME=ytsoar
      - AIR_POLL=true
      - AIR_WATCH_TMOUT=500ms
      - CONNECTORS_DIR=/opt/ytsoar/connectors
      - APP_ENV=development
      # Dev-only secret. APP_ENV=production refuses to start with this value.
      - JWT_SECRET=dev-secret
      # Seeded on first boot only, when nobody holds the admin role yet.
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@ytsoar.local
      - ADMIN_PASSWORD=admin123!
      # Exact origins: a wildcard is invalid once credentials are involved.
      # This list also drives the websocket origin check.
      - CORS_ORIGINS=http://localhost:9999,http://localhost:3000
      # Everything is plain http behind nginx in dev.
      - COOKIE_SECURE=false
      # OIDC: where the callback sends the browser after a session is set, and
      # the browser-facing base used to build the IdP redirect_uri (nginx strips
      # /auth-api/ before it reaches the api).
      - FRONTEND_URL=http://localhost:9999
      - AUTH_PUBLIC_URL=http://localhost:9999/auth-api
    networks:
      - ytsoar
    depends_on:
      ytsoar_postgres:
        condition: service_healthy
  ytsoar_nginx:
    build: ../app/nginx
    container_name: ytsoar_nginx
    ports:
      - "9999:9999"
    volumes:
      - ../app/nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    depends_on:
      - ytsoar_api
    networks:
      - ytsoar
volumes:
  postgres_data:
