name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/ytsoar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/ytsoar/go.mod
          cache-dependency-path: app/ytsoar/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          # Build it with the Go of go.mod. A release binary can use an older Go.
          install-mode: goinstall
          working-directory: app/ytsoar

  backend-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/ytsoar
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ytsoar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ytsoar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/ytsoar/go.mod
          cache-dependency-path: app/ytsoar/go.sum
      - uses: ./.github/actions/sandbox-runtimes
      - name: Migrate the database
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.29.0 -dir db/migrations postgres "$TEST_DATABASE_URL" up
      # -p 1: the job queue tests and the integration tests share the queue.
      - run: go test -p 1 ./...

  frontend-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  browser-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ytsoar_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Start Keycloak
        working-directory: .
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/docker/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.2 start-dev --import-realm --http-port=8180
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/ytsoar/go.mod
          cache-dependency-path: app/ytsoar/go.sum
      - uses: ./.github/actions/sandbox-runtimes
      - name: Build the backend
        working-directory: app/ytsoar
        run: go build ./...  # so the web servers of Playwright start fast
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Keycloak
        run: curl -sf --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8180/realms/ytsoar
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            app/frontend/playwright-report
            app/frontend/test-results
          retention-days: 7
      - name: Keycloak log
        if: failure()
        run: docker logs keycloak | tail -100
